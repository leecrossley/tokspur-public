# cargo-deny 0.20.2 policy. The rust-supply target and CI select advisories, bans and sources explicitly. Licences are reviewed outside cargo-deny, so there is no licence allowlist here.
[graph]
all-features = true
# tokspur-sys refuses every other target at compile time.
targets = ["aarch64-apple-darwin"]

[advisories]
db-path = "../build/rust-tools/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
